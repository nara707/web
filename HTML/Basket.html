<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canasta de compras — STYLO.IO</title>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800;12..96,900&family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/Basket.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <a class="nav-logo" href="#">STYLO<span>.IO</span></a>
        <div class="nav-search">
            <input type="text" placeholder="Busca artistas, estilos..." />
            <span class="nav-search-icon material-symbols-outlined">search</span>
        </div>
        <div class="nav-links">
            <a href="landing.html">Explora</a>
            <a href="landing.html">Categorías</a>
            <a href="Basket.html">Canasta</a>
            <a href="perfil.html">Perfil</a>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="main">
        <div class="inner-main">

            <div class="stars">
                <h2>Basket</h2>
                <div class="left-star">✦</div>
                <div class="left2-star">✦</div>
            </div>

            <h4>Historial de Compras</h4>

            <!-- Filtros (renderizados por JS) -->
            <div id="filtrosContainer" class="filter-chips-row"></div>

            <!-- Lista de pedidos (renderizados por JS) -->
            <div class="basket-container"></div>

            <!-- Botón pagar global -->
            <button class="pagar" id="payButton">
                <span class="material-symbols-outlined">payment</span>
                Pagar todo
            </button>
        </div>
    </main>

    <!-- Overlay de éxito -->
    <div class="success-overlay" id="success">
        <div class="check">🌸</div>
        <p id="successMsg">¡Pago realizado!</p>
    </div>

    <!-- MODAL DE MENSAJES -->
    <div class="modal-mensaje-overlay" id="modalMensaje">
        <div class="modal-mensaje-box">
            <div class="modal-mensaje-icon" id="modalIcon">🌸</div>
            <h3 class="modal-mensaje-titulo" id="modalTitulo">Éxito</h3>
            <p class="modal-mensaje-texto" id="modalTexto">Operación realizada correctamente</p>
            <button class="modal-mensaje-boton" id="modalCerrarBtn">Aceptar</button>
        </div>
    </div>

    <script src="../JS/basket.js"></script>
</body>
</html>
